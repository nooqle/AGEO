# A3 问题模板配置文件
# 用途：为品牌声量分析生成标准化的模拟问题
# 变量：{brand_name} - 品牌名称
# 目标平台：豆包、混元、Kimi、DeepSeek
# 问题设计原则：模拟真实用户在 AI 对话产品上咨询品牌相关问题的场景
# 场景覆盖：品牌认知、产品特性、竞品对比、购买决策、用户评价、行业地位

questions:
  # 品牌认知类（2 题）
  - question_id: "Q01"
    category: "品牌认知"
    core_question: "{brand_name}是什么？"
    user_intent: "了解品牌基本信息"
    decision_stage: "认知阶段"

  - question_id: "Q02"
    category: "品牌认知"
    core_question: "{brand_name}是做什么的？"
    user_intent: "了解品牌业务范围"
    decision_stage: "认知阶段"

  # 产品特性类（2 题）
  - question_id: "Q03"
    category: "产品特性"
    core_question: "{brand_name}有什么特点？"
    user_intent: "了解产品核心优势"
    decision_stage: "兴趣阶段"

  - question_id: "Q04"
    category: "产品特性"
    core_question: "{brand_name}的主要功能是什么？"
    user_intent: "了解产品功能细节"
    decision_stage: "兴趣阶段"

  # 竞品对比类（2 题）
  - question_id: "Q05"
    category: "竞品对比"
    core_question: "{brand_name}和同类产品有什么区别？"
    user_intent: "比较不同品牌差异"
    decision_stage: "评估阶段"

  - question_id: "Q06"
    category: "竞品对比"
    core_question: "{brand_name}相比竞品的优势在哪？"
    user_intent: "了解竞争优势"
    decision_stage: "评估阶段"

  # 购买决策类（2 题）
  - question_id: "Q07"
    category: "购买决策"
    core_question: "{brand_name}值得买吗？"
    user_intent: "购买决策参考"
    decision_stage: "决策阶段"

  - question_id: "Q08"
    category: "购买决策"
    core_question: "{brand_name}性价比怎么样？"
    user_intent: "评估产品性价比"
    decision_stage: "决策阶段"

  # 用户评价类（2 题）
  - question_id: "Q09"
    category: "用户评价"
    core_question: "{brand_name}用户评价如何？"
    user_intent: "了解真实用户反馈"
    decision_stage: "验证阶段"

  - question_id: "Q10"
    category: "用户评价"
    core_question: "使用{brand_name}的体验怎么样？"
    user_intent: "了解使用体验"
    decision_stage: "验证阶段"

  # 行业地位类（2 题）
  - question_id: "Q11"
    category: "行业地位"
    core_question: "{brand_name}在行业中的地位如何？"
    user_intent: "了解品牌市场地位"
    decision_stage: "信任阶段"

  - question_id: "Q12"
    category: "行业地位"
    core_question: "{brand_name}是行业头部品牌吗？"
    user_intent: "验证品牌权威性"
    decision_stage: "信任阶段"
