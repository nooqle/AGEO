name: Deploy Demo

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Diagnostic mode only. Optional minutes to inspect; defaults to 120."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: demo-log-diagnostic
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect demo server logs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DEMO_SSH_PORT: ${{ secrets.DEMO_SSH_PORT || '22' }}
      SINCE_MINUTES: ${{ github.event.inputs.ref || '120' }}

    steps:
      - name: Validate SSH configuration
        shell: bash
        env:
          DEMO_SSH_HOST: ${{ secrets.DEMO_SSH_HOST }}
          DEMO_SSH_USER: ${{ secrets.DEMO_SSH_USER }}
          DEMO_SSH_KEY: ${{ secrets.DEMO_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${DEMO_SSH_HOST:?Missing DEMO_SSH_HOST secret}"
          : "${DEMO_SSH_USER:?Missing DEMO_SSH_USER secret}"
          : "${DEMO_SSH_KEY:?Missing DEMO_SSH_KEY secret}"
          : "${DEMO_SSH_PORT:?Missing DEMO_SSH_PORT secret or default}"

      - name: Read runtime logs
        shell: bash
        env:
          DEMO_SSH_HOST: ${{ secrets.DEMO_SSH_HOST }}
          DEMO_SSH_USER: ${{ secrets.DEMO_SSH_USER }}
          DEMO_SSH_KEY: ${{ secrets.DEMO_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          key_path=~/.ssh/ageo_demo_log_key
          trap 'rm -f "$key_path"' EXIT
          printf '%s\n' "$DEMO_SSH_KEY" | sed 's/\\n/\n/g' | tr -d '\r' > "$key_path"
          chmod 600 "$key_path"
          ssh-keygen -y -f "$key_path" >/dev/null
          ssh_options=(
            -i "$key_path"
            -p "$DEMO_SSH_PORT"
            -o BatchMode=yes
            -o ConnectTimeout=20
            -o ConnectionAttempts=1
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile=~/.ssh/known_hosts
          )

          case "${SINCE_MINUTES}" in
            ''|*[!0-9]*) SINCE_MINUTES=120 ;;
          esac
          if (( SINCE_MINUTES < 10 )); then SINCE_MINUTES=10; fi
          if (( SINCE_MINUTES > 720 )); then SINCE_MINUTES=720; fi

          remote_script=$(cat <<'SCRIPT'
          set -euo pipefail
          minutes="$1"
          since="${minutes} minutes ago"
          echo "== host =="
          hostname
          date -Is
          echo
          echo "== services =="
          systemctl is-active ageo-backend.service || true
          systemctl is-active ageo-frontend.service || true
          systemctl --no-pager --full status ageo-backend.service | sed -n '1,35p' || true
          echo
          echo "== backend recent doubao/a4/browser/error lines =="
          sudo journalctl -u ageo-backend.service --since "$since" --no-pager -o short-iso |
            grep -Ei 'doubao|豆包|A4|browser|fetch|question|第11|11/|timeout|timed out|error|exception|traceback|modal|takeover|blocked|failed' |
            tail -n 260 || true
          echo
          echo "== backend last 220 lines =="
          sudo journalctl -u ageo-backend.service --since "$since" --no-pager -o short-iso |
            tail -n 220 || true
          echo
          echo "== frontend last 80 lines =="
          sudo journalctl -u ageo-frontend.service --since "$since" --no-pager -o short-iso |
            tail -n 80 || true
          echo
          echo "== recent failure evidence files =="
          if [ -d /srv/ageo-deploy/shared/runtime/failure-evidence ]; then
            find /srv/ageo-deploy/shared/runtime/failure-evidence -type f -mmin "-$minutes" -printf '%TY-%Tm-%Td %TH:%TM:%TS %p\n' |
              sort |
              tail -n 50 || true
          else
            echo "failure evidence directory not found"
          fi
SCRIPT
          )

          ssh "${ssh_options[@]}" "${DEMO_SSH_USER}@${DEMO_SSH_HOST}" \
            "bash -s -- $(printf '%q' "$SINCE_MINUTES")" <<< "$remote_script"
