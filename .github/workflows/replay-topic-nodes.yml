name: Replay Topic Nodes Read Only

on:
  push:
    branches: [codex/deepseek41-platform-billing-20260911]
    paths:
      - ops/replay-topic-nodes.py
      - .github/workflows/replay-topic-nodes.yml
  workflow_dispatch:
    inputs:
      expected_release:
        description: Exact production release SHA to replay, without changing the release.
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: replay-topic-nodes-read-only
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Replay the current official Amway projection without writes or provider calls
        shell: bash
        env:
          DEMO_SSH_HOST: ${{ secrets.DEMO_SSH_HOST }}
          DEMO_SSH_PORT: ${{ secrets.DEMO_SSH_PORT || '22' }}
          DEMO_SSH_USER: ${{ secrets.DEMO_SSH_USER }}
          DEMO_SSH_KEY: ${{ secrets.DEMO_SSH_KEY }}
          EXPECTED_RELEASE: ${{ inputs.expected_release || 'fb2c5e24a26baf9e6684c1851513e384b049ea40' }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_RELEASE" =~ ^[a-f0-9]{40}$ ]] || exit 2
          install -d -m 700 ~/.ssh replay-output
          key_path=~/.ssh/ageo_topic_replay_key
          remote_dir=''
          printf '%s\n' "$DEMO_SSH_KEY" | sed 's/\\n/\n/g' | tr -d '\r' > "$key_path"
          chmod 600 "$key_path"
          ssh-keygen -y -f "$key_path" >/dev/null
          ssh_options=(-i "$key_path" -p "$DEMO_SSH_PORT" -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=1 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts)
          scp_options=(-i "$key_path" -P "$DEMO_SSH_PORT" -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts)
          remote="${DEMO_SSH_USER}@${DEMO_SSH_HOST}"
          cleanup() {
            if [[ "$remote_dir" =~ ^/tmp/ageo-topic-replay\.[A-Za-z0-9]{12}$ ]]; then
              ssh "${ssh_options[@]}" "$remote" "sudo -n rm -f '$remote_dir/replay-topic-nodes.py' '$remote_dir/answers.json' '$remote_dir/replay.json' '$remote_dir/topics.csv'; rmdir '$remote_dir'" || true
            fi
            rm -f "$key_path"
          }
          trap cleanup EXIT
          remote_dir=$(ssh "${ssh_options[@]}" "$remote" 'umask 077; mktemp -d /tmp/ageo-topic-replay.XXXXXXXXXXXX')
          [[ "$remote_dir" =~ ^/tmp/ageo-topic-replay\.[A-Za-z0-9]{12}$ ]] || exit 2
          scp "${scp_options[@]}" ops/replay-topic-nodes.py "$remote:$remote_dir/replay-topic-nodes.py"
          ssh "${ssh_options[@]}" "$remote" "sudo -n /srv/ageo-deploy/current/aeo-platform/backend/.venv/bin/python -B '$remote_dir/replay-topic-nodes.py' --expected-release '$EXPECTED_RELEASE' --output-dir '$remote_dir'"
          for file in answers.json replay.json topics.csv; do
            scp "${scp_options[@]}" "$remote:$remote_dir/$file" "replay-output/$file"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: amway-topic-replay-${{ github.run_id }}
          path: replay-output/
          retention-days: 1
          if-no-files-found: error
