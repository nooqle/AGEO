name: Inspect Demo Domain Logs

on:
  workflow_dispatch:
    inputs:
      since_minutes:
        description: "Look back this many minutes, clamped to 10-1440."
        required: false
        default: "720"
        type: string
      include_aio_browser:
        description: "Also capture current AIO browser info and screenshot."
        required: false
        default: "false"
        type: string
      focus_doubao_tab:
        description: "Click the left-most Doubao browser tab before the AIO screenshot."
        required: false
        default: "false"
        type: string

permissions:
  contents: read

concurrency:
  group: inspect-demo-domain-logs
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect demo domain diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      DEMO_SSH_PORT: ${{ secrets.DEMO_SSH_PORT || '22' }}
      SINCE_MINUTES: ${{ github.event.inputs.since_minutes || '720' }}

    steps:
      - name: Validate SSH configuration
        shell: bash
        env:
          DEMO_SSH_HOST: ${{ secrets.DEMO_SSH_HOST }}
          DEMO_SSH_USER: ${{ secrets.DEMO_SSH_USER }}
          DEMO_SSH_KEY: ${{ secrets.DEMO_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${DEMO_SSH_HOST:?Missing DEMO_SSH_HOST secret}"
          : "${DEMO_SSH_USER:?Missing DEMO_SSH_USER secret}"
          : "${DEMO_SSH_KEY:?Missing DEMO_SSH_KEY secret}"
          : "${DEMO_SSH_PORT:?Missing DEMO_SSH_PORT secret or default}"

      - name: Read demo domain diagnostics
        shell: bash
        env:
          DEMO_SSH_HOST: ${{ secrets.DEMO_SSH_HOST }}
          DEMO_SSH_USER: ${{ secrets.DEMO_SSH_USER }}
          DEMO_SSH_KEY: ${{ secrets.DEMO_SSH_KEY }}
          FOCUS_DOUBAO_TAB: ${{ github.event.inputs.focus_doubao_tab || 'false' }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          key_path=~/.ssh/ageo_demo_domain_inspect_key
          trap 'rm -f "$key_path"' EXIT
          printf '%s\n' "$DEMO_SSH_KEY" | sed 's/\\n/\n/g' | tr -d '\r' > "$key_path"
          chmod 600 "$key_path"
          ssh-keygen -y -f "$key_path" >/dev/null
          ssh_options=(
            -i "$key_path"
            -p "$DEMO_SSH_PORT"
            -o BatchMode=yes
            -o ConnectTimeout=20
            -o ConnectionAttempts=1
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile=~/.ssh/known_hosts
          )

          case "${SINCE_MINUTES}" in
            ''|*[!0-9]*) SINCE_MINUTES=720 ;;
          esac
          if (( SINCE_MINUTES < 10 )); then SINCE_MINUTES=10; fi
          if (( SINCE_MINUTES > 1440 )); then SINCE_MINUTES=1440; fi

          remote_script=$(cat <<'SCRIPT'
          set -euo pipefail
          minutes="$1"
          since="${minutes} minutes ago"

          redact() {
            sed -E \
              -e 's/(sk-[A-Za-z0-9_-]{6})[A-Za-z0-9_-]+/[REDACTED_SK]/g' \
              -e 's/(Bearer )[A-Za-z0-9._-]+/\1[REDACTED]/g' \
              -e 's/([A-Z0-9_]*(KEY|SECRET|TOKEN)[A-Z0-9_]*=).*/\1[REDACTED]/g'
          }

          print_env_status() {
            local env_file="$1"
            local name="$2"
            if [ ! -f "$env_file" ]; then
              echo "$name=env_file_missing"
              return
            fi
            if grep -Eq "^${name}=" "$env_file"; then
              if [[ "$name" == *KEY* || "$name" == *SECRET* || "$name" == *TOKEN* ]]; then
                echo "$name=present"
              else
                local value
                value="$(grep -E "^${name}=" "$env_file" | tail -n 1 | cut -d= -f2- | sed -E 's/^"|"$//g')"
                echo "$name=${value:-<empty>}"
              fi
            else
              echo "$name=missing"
            fi
          }

          echo "== host =="
          hostname
          date -Is
          echo

          echo "== release =="
          current="$(readlink -f /srv/ageo-deploy/current || true)"
          echo "current=${current:-missing}"
          if [ -n "${current:-}" ] && [ -f "$current/.release-sha" ]; then
            echo "sha=$(cat "$current/.release-sha")"
          fi
          if [ -n "${current:-}" ] && [ -f "$current/.release-created-at" ]; then
            echo "release_created_at=$(cat "$current/.release-created-at")"
          fi
          echo

          echo "== service status =="
          systemctl is-active ageo-backend.service || true
          systemctl is-active ageo-frontend.service || true
          echo

          echo "== resource snapshot =="
          uptime || true
          free -h || true
          df -h / /srv/ageo-deploy || true
          ps -eo pid,ppid,pcpu,pmem,comm,args --sort=-pcpu | head -n 18 || true
          echo

          echo "== local endpoint timings =="
          dashboard_html="$(mktemp)"
          curl -fsS --max-time 10 http://127.0.0.1:3000/dashboard -o "$dashboard_html" || true
          static_paths="$(
            grep -oE '/_next/static/(chunks|css)/[^"]+\.(js|css)' "$dashboard_html" |
              sort -u |
              head -n 16 || true
          )"
          {
            echo http://127.0.0.1:3000/dashboard
            if [ -n "$static_paths" ]; then
              printf '%s\n' "$static_paths" | sed 's#^#http://127.0.0.1:3000#'
            fi
            echo http://127.0.0.1:8000/health
            echo http://127.0.0.1:8000/api/v1/auth/me
          } | while IFS= read -r url; do
            [ -n "$url" ] || continue
            curl -o /dev/null -sS --max-time 10 \
              -w "status=%{http_code} ttfb=%{time_starttransfer} total=%{time_total} size=%{size_download} url=${url}\n" \
              "$url" || true
          done
          rm -f "$dashboard_html" || true
          echo

          echo "== nginx recent slow/static lines =="
          if [ -r /var/log/nginx/access.log ]; then
            sudo tail -n 2000 /var/log/nginx/access.log |
              grep -E 'GET /dashboard|GET /_next/|GET /api/v1| 499 | 500 | 502 | 503 | 504 ' |
              tail -n 160 || true
          else
            echo "nginx access log not readable"
          fi
          echo

          echo "== nginx log files =="
          sudo find /var/log/nginx -maxdepth 1 -type f \
            -printf '%TY-%Tm-%TdT%TH:%TM:%TS %s %p\n' |
            sort |
            tail -n 20 || true
          echo

          echo "== nginx spike window 2026-05-07 23:30-23:59 summary =="
          sudo zgrep -hE '\[07/May/2026:23:(3[0-9]|4[0-9]|5[0-9]):' /var/log/nginx/access.log* 2>/dev/null |
            awk '
              {
                path=$7
                bytes=$10+0
                total_count++
                total_bytes+=bytes
                if (path ~ /^\/_next\//) {
                  static_count++
                  static_bytes+=bytes
                } else if (path ~ /^\/api\/v1\//) {
                  api_count++
                  api_bytes+=bytes
                } else if (path ~ /^\/dashboard/) {
                  page_count++
                  page_bytes+=bytes
                }
              }
              END {
                printf "total_requests=%d total_bytes=%d static_requests=%d static_bytes=%d api_requests=%d api_bytes=%d dashboard_requests=%d dashboard_bytes=%d\n",
                  total_count, total_bytes, static_count, static_bytes, api_count, api_bytes, page_count, page_bytes
              }
            ' || true
          echo

          echo "== nginx spike window 2026-05-07 23:30-23:59 top paths =="
          sudo zgrep -hE '\[07/May/2026:23:(3[0-9]|4[0-9]|5[0-9]):' /var/log/nginx/access.log* 2>/dev/null |
            awk '
              {
                path=$7
                sub(/\?.*/, "", path)
                count[path]++
                bytes[path]+=$10+0
              }
              END {
                for (path in count) {
                  printf "%12d %8d %s\n", bytes[path], count[path], path
                }
              }
            ' |
            sort -nr |
            head -n 40 || true
          echo

          echo "== frontend journal warnings/errors =="
          sudo journalctl -u ageo-frontend.service --since "$since" --no-pager -o short-iso |
            grep -Ei 'error|warn|failed|timeout|timed out|heap|memory|slow|ready|started' |
            tail -n 180 || true
          echo

          echo "== url intelligence configuration =="
          env_file=/srv/ageo-deploy/shared/backend/.env.local
          print_env_status "$env_file" TEXT_LIGHT_LLM_PROVIDER
          print_env_status "$env_file" TEXT_LIGHT_MODEL_NAME
          print_env_status "$env_file" URL_INTELLIGENCE_TIMEOUT_SECONDS
          print_env_status "$env_file" DEEPSEEK_API_KEY
          print_env_status "$env_file" GLM5_API_KEY
          print_env_status "$env_file" MINIMAX_API_KEY
          echo

          echo "== backend domain intelligence journal lines =="
          sudo journalctl -u ageo-backend.service --since "$since" --no-pager -o short-iso |
            grep -Ei 'url_intelligence|domain intelligence|domain_intelligence|citation domain|citation_domain|resolve_citation|source_type|site_category|jd\.com|jingfen|smzdm|taobao|invalid json|json parse|domain analysis failed|falling back to GLM5|DeepSeek API key|GLM5 API key' |
            redact |
            tail -n 700 || true
          echo

          echo "== backend A4/error journal lines =="
          sudo journalctl -u ageo-backend.service --since "$since" --no-pager -o short-iso |
            grep -Ei 'A4|answer_fetch|fetch result|fetch_results|citation|429|timeout|timed out|exception|traceback|error|failed|kimi|moonshot|deepseek|glm5|doubao|yuanbao' |
            redact |
            tail -n 500 || true
          echo

          echo "== recent task/output domain snippets =="
          if [ -n "${current:-}" ] && [ -x "$current/aeo-platform/backend/.venv/bin/python" ]; then
            cd "$current/aeo-platform/backend"
            "$current/aeo-platform/backend/.venv/bin/python" - "$minutes" <<'PY'
          import asyncio
          import json
          import os
          import re
          import sys
          from pathlib import Path

          minutes = int(sys.argv[1])


          def load_env(path: Path) -> None:
              if not path.exists():
                  return
              for raw in path.read_text(encoding="utf-8", errors="ignore").splitlines():
                  line = raw.strip()
                  if not line or line.startswith("#") or "=" not in line:
                      continue
                  key, value = line.split("=", 1)
                  key = key.strip()
                  value = value.strip().strip('"').strip("'")
                  if key and key not in os.environ:
                      os.environ[key] = value


          def clean(text: object, limit: int = 1200) -> str:
              value = str(text or "")
              value = re.sub(r"sk-[A-Za-z0-9_-]{8,}", "[REDACTED_SK]", value)
              value = re.sub(r"Bearer [A-Za-z0-9._-]+", "Bearer [REDACTED]", value)
              value = value.replace("\n", " ")
              value = re.sub(r"\s+", " ", value).strip()
              if len(value) > limit:
                  return value[:limit] + "..."
              return value


          def snippets(text: object) -> list[str]:
              value = str(text or "")
              lower = value.lower()
              keys = [
                  "jingfen.jd.com",
                  "jd.com",
                  "post.smzdm.com",
                  "smzdm.com",
                  "url_intelligence",
                  "source_type",
                  "site_category",
                  "缺乏特征",
                  "未知",
              ]
              out: list[str] = []
              for key in keys:
                  idx = lower.find(key.lower())
                  if idx < 0:
                      continue
                  start = max(0, idx - 450)
                  end = min(len(value), idx + 900)
                  out.append(clean(value[start:end]))
                  if len(out) >= 3:
                      break
              return out


          async def main() -> None:
              load_env(Path(".env.local"))
              from sqlalchemy import text
              from app.core.database import AsyncSessionLocal

              async with AsyncSessionLocal() as db:
                  task_rows = (
                      await db.execute(
                          text(
                              """
                              select
                                id::text as id,
                                brand_name,
                                status::text as status,
                                current_stage,
                                updated_at,
                                left(coalesce(stage_results_cache::text, ''), 240000) as payload
                              from analysis_tasks
                              where updated_at >= now() - make_interval(mins => :minutes)
                                and (
                                  lower(coalesce(stage_results_cache::text, '')) like '%jd.com%'
                                  or lower(coalesce(stage_results_cache::text, '')) like '%smzdm%'
                                  or lower(coalesce(stage_results_cache::text, '')) like '%url_intelligence%'
                                  or lower(coalesce(stage_results_cache::text, '')) like '%source_type%'
                                  or lower(coalesce(stage_results_cache::text, '')) like '%site_category%'
                                )
                              order by updated_at desc
                              limit 8
                              """
                          ),
                          {"minutes": minutes},
                      )
                  ).mappings().all()
                  print(f"-- analysis_tasks matched: {len(task_rows)}")
                  for row in task_rows:
                      print(
                          "task",
                          row["id"],
                          clean(row["brand_name"], 80),
                          row["status"],
                          row["current_stage"],
                          row["updated_at"],
                      )
                      for item in snippets(row["payload"]):
                          print("  snippet:", item)

                  message_rows = (
                      await db.execute(
                          text(
                              """
                              select
                                id::text as id,
                                session_id::text as session_id,
                                output_type,
                                created_at,
                                left(coalesce(output_data, ''), 240000) as payload
                              from messages
                              where created_at >= now() - make_interval(mins => :minutes)
                                and output_data is not null
                                and (
                                  lower(output_data) like '%jd.com%'
                                  or lower(output_data) like '%smzdm%'
                                  or lower(output_data) like '%url_intelligence%'
                                  or lower(output_data) like '%source_type%'
                                  or lower(output_data) like '%site_category%'
                                )
                              order by created_at desc
                              limit 8
                              """
                          ),
                          {"minutes": minutes},
                      )
                  ).mappings().all()
                  print(f"-- output messages matched: {len(message_rows)}")
                  for row in message_rows:
                      print(
                          "message",
                          row["id"],
                          "session",
                          row["session_id"],
                          "type",
                          clean(row["output_type"], 80),
                          row["created_at"],
                      )
                      for item in snippets(row["payload"]):
                          print("  snippet:", item)


          asyncio.run(main())
          PY
          else
            echo "backend python runtime not found"
          fi
          SCRIPT
          )

          ssh "${ssh_options[@]}" "${DEMO_SSH_USER}@${DEMO_SSH_HOST}" \
            "bash -s -- $(printf '%q' "$SINCE_MINUTES")" <<< "$remote_script"

      - name: Capture AIO browser diagnostic
        if: ${{ github.event.inputs.include_aio_browser == 'true' }}
        shell: bash
        env:
          DEMO_SSH_HOST: ${{ secrets.DEMO_SSH_HOST }}
          DEMO_SSH_USER: ${{ secrets.DEMO_SSH_USER }}
          DEMO_SSH_KEY: ${{ secrets.DEMO_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          key_path=~/.ssh/ageo_demo_aio_inspect_key
          trap 'rm -f "$key_path"' EXIT
          printf '%s\n' "$DEMO_SSH_KEY" | sed 's/\\n/\n/g' | tr -d '\r' > "$key_path"
          chmod 600 "$key_path"
          ssh-keygen -y -f "$key_path" >/dev/null
          ssh_options=(
            -i "$key_path"
            -p "$DEMO_SSH_PORT"
            -o BatchMode=yes
            -o ConnectTimeout=20
            -o ConnectionAttempts=1
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile=~/.ssh/known_hosts
          )
          scp_options=(
            -i "$key_path"
            -P "$DEMO_SSH_PORT"
            -o BatchMode=yes
            -o ConnectTimeout=20
            -o ConnectionAttempts=1
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile=~/.ssh/known_hosts
          )

          remote_png="/tmp/ageo-aio-browser-snapshot-${GITHUB_RUN_ID}.png"
          remote_script=$(cat <<'SCRIPT'
          set -euo pipefail
          remote_png="$1"
          focus_doubao_tab="${2:-false}"
          current="$(readlink -f /srv/ageo-deploy/current || true)"
          if [ -z "${current:-}" ] || [ ! -x "$current/aeo-platform/backend/.venv/bin/python" ]; then
            echo "aio_browser_status=backend_runtime_missing"
            exit 0
          fi
          cd "$current/aeo-platform/backend"
          "$current/aeo-platform/backend/.venv/bin/python" - "$remote_png" "$focus_doubao_tab" <<'PY'
          import asyncio
          import json
          import os
          import sys
          from pathlib import Path

          remote_png = Path(sys.argv[1])
          focus_doubao_tab = str(sys.argv[2] if len(sys.argv) > 2 else "").lower() == "true"

          def load_env(path: Path) -> None:
              if not path.exists():
                  return
              for raw in path.read_text(encoding="utf-8", errors="ignore").splitlines():
                  line = raw.strip()
                  if not line or line.startswith("#") or "=" not in line:
                      continue
                  key, value = line.split("=", 1)
                  key = key.strip()
                  value = value.strip().strip('"').strip("'")
                  if key and key not in os.environ:
                      os.environ[key] = value

          async def main() -> None:
              load_env(Path("/srv/ageo-deploy/shared/backend/.env.local"))
              load_env(Path(".env.local"))
              base_url = os.environ.get("AIO_BASE_URL", "").strip()
              auth_token = os.environ.get("AIO_AUTH_TOKEN", "").strip()
              if not base_url:
                  print("aio_browser_status=aio_base_url_missing")
                  return

              from app.core.config import settings
              from app.core.fetchers.browser.aio_client import AioSandboxClient

              client = AioSandboxClient(
                  base_url=base_url,
                  auth_token=auth_token or settings.AIO_AUTH_TOKEN,
                  timeout_seconds=float(os.environ.get("AIO_REQUEST_TIMEOUT_SECONDS") or settings.AIO_REQUEST_TIMEOUT_SECONDS),
              )
              try:
                  info = await client.get_browser_info()
                  safe_info = {
                      "base_url_present": True,
                      "cdp_url_present": bool(info.cdp_url),
                      "vnc_url_present": bool(info.vnc_url),
                      "user_agent": info.user_agent,
                      "viewport": info.viewport,
                  }
                  print("aio_browser_info=" + json.dumps(safe_info, ensure_ascii=False, sort_keys=True))
                  if focus_doubao_tab:
                      action = await client.execute_browser_action(
                          {"action_type": "CLICK", "x": 120, "y": 16}
                      )
                      print(
                          "aio_focus_doubao_tab="
                          + json.dumps(
                              {
                                  "status": action.status,
                                  "action_performed": action.action_performed,
                              },
                              sort_keys=True,
                          )
                      )
                      await asyncio.sleep(1.5)
                  screenshot = await client.take_browser_screenshot()
                  remote_png.write_bytes(screenshot.image_bytes)
                  safe_shot = {
                      "content_type": screenshot.content_type,
                      "bytes": len(screenshot.image_bytes),
                      "screen_width": screenshot.screen_width,
                      "screen_height": screenshot.screen_height,
                      "image_width": screenshot.image_width,
                      "image_height": screenshot.image_height,
                      "path": str(remote_png),
                  }
                  print("aio_browser_screenshot=" + json.dumps(safe_shot, sort_keys=True))
              except Exception as exc:
                  print("aio_browser_error=" + type(exc).__name__ + ": " + str(exc)[:500])

          asyncio.run(main())
          PY
          SCRIPT
          )

          ssh "${ssh_options[@]}" "${DEMO_SSH_USER}@${DEMO_SSH_HOST}" \
            "bash -s -- $(printf '%q' "$remote_png") $(printf '%q' "$FOCUS_DOUBAO_TAB")" <<< "$remote_script" |
            tee aio-browser-status.txt
          scp "${scp_options[@]}" "${DEMO_SSH_USER}@${DEMO_SSH_HOST}:${remote_png}" aio-browser-snapshot.png || true

      - name: Upload AIO browser diagnostic
        if: ${{ github.event.inputs.include_aio_browser == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: aio-browser-diagnostic
          path: |
            aio-browser-status.txt
            aio-browser-snapshot.png
          if-no-files-found: warn
